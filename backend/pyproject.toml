[project]
name = "sqldoc"
version = "0.1.0"
description = "SQL Documentor - documents Microsoft SQL Server schemas, stats and column-level lineage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19",
    "sqlglot>=30.17",
    "typer>=0.27",
    "rich>=13",
    "pymssql>=2.3.13",
]

[project.optional-dependencies]
# Integrated (Kerberos/SSPI) auth needs pyodbc + Microsoft ODBC Driver 18 (system package).
odbc = ["pyodbc>=5.3"]

[project.scripts]
sqldoc = "sqldoc.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqldoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live SQL Server on localhost:1433 and SQLDOC_TEST_PASSWORD",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
