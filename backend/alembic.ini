# Used only for generating migrations (`uv run alembic revision --autogenerate -m "..."`).
# At runtime, sqldoc.store.db.upgrade() drives Alembic programmatically.
[alembic]
script_location = src/sqldoc/store/migrations
sqlalchemy.url = sqlite:///.alembic-scratch.sqlite
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
